name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/crm-dashboard
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/crm-dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run security:audit

  ecb-mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions/ecb-mcp
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check index.ts
      # Tool-contract gate: every tool in EXPECTED_FULL_CONTRACT must declare a
      # description, annotations, and a Zod outputSchema (see tools/CONVENTION.md).
      - run: deno test --allow-env tools.test.ts

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: bash scripts/secret-scan.sh

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0
      - run: supabase start
      - run: supabase db reset --local
      - run: supabase test db

  ssmm-spike-1-authority-integrity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/ssmm-spike-1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0
      - name: Check Edge Function and run unit tests
        run: |
          deno check supabase/functions/ssmm-runtime/index.ts
          deno test supabase/functions/ssmm-runtime --allow-env
      - name: Start disposable local Supabase
        run: |
          mkdir -p supabase/functions
          cat > supabase/functions/.env <<'ENV'
          SSMM_RUNTIME_SHARED_SECRET=ci-local-runtime-secret
          SSMM_PURPOSE_ID=ci-purpose
          SSMM_PURPOSE_LABEL=CI purpose
          SSMM_ORIENTATION_ID=ci-orientation
          SSMM_ORIENTATION_LABEL=CI orientation
          SSMM_SHAPE_ENDPOINT=http://127.0.0.1:9/v1/chat/completions
          SSMM_SHAPE_API_KEY=ci-unused-provider-key
          SSMM_SHAPE_MODEL=ci-unused-model
          ENV
          supabase start
          supabase db reset --local
      - name: Run transactional database tests
        run: supabase test db
      - name: Run different-request concurrency tests
        run: node tests/concurrent-idempotency.mjs
      - name: Serve the local Edge Function
        run: |
          supabase functions serve ssmm-runtime \
            --env-file supabase/functions/.env \
            --no-verify-jwt > /tmp/ssmm-functions.log 2>&1 &
          echo $! > /tmp/ssmm-functions.pid
          for attempt in $(seq 1 30); do
            code=$(curl -sS -o /tmp/ssmm-probe.json -w '%{http_code}' \
              -X POST http://127.0.0.1:55421/functions/v1/ssmm-runtime || true)
            if [ "$code" = "401" ]; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/ssmm-functions.log
          cat /tmp/ssmm-probe.json || true
          exit 1
      - name: Run HTTP conflict and restoration tests
        env:
          SSMM_RUNTIME_SHARED_SECRET: ci-local-runtime-secret
        run: node tests/http-authority-integrity.mjs
      - name: Stop disposable local Supabase
        if: always()
        run: |
          if [ -f /tmp/ssmm-functions.pid ]; then
            kill "$(cat /tmp/ssmm-functions.pid)" || true
          fi
          supabase stop --no-backup || true
